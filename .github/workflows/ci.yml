name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_COLOR: "1"
  HYPOTHESIS_PROFILE: ci

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
      - run: uv sync --frozen --group lint
      - run: uv run ruff check --output-format=github .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run codespell

  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python: "3.14"
          - os: windows-latest
            python: "3.14"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # hatch-vcs derives the version from Git tags
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
      # Minimal dependencies only: NumPy and array-api-compat.
      - run: uv sync --frozen --group test
      - run: uv run pytest --cov --cov-report=term --cov-report=xml

  tests-all-extras:
    name: Tests with all extras (PyTorch on CPU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
      - run: uv sync --frozen --group test --extra symbolic --extra plot
      # CPU-only PyTorch wheels avoid downloading the CUDA stack.
      - run: uv pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: uv run --no-sync pytest --cov --cov-report=term

  tests-pypy:
    name: Tests (PyPy 3.11, NumPy backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: pypy3.11
      - run: uv sync --frozen --group test
      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          uv run pytest 2>&1 | tee pytest.log
      # Surface the end of the pytest output as an annotation, so collection
      # errors (which the annotation plugin does not report) are visible.
      - name: Report pytest output
        if: failure()
        shell: bash
        run: |
          body=$(tail -n 60 pytest.log | sed -e 's/%/%25/g' | sed -e ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=pytest output (PyPy)::${body}"

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
      - run: uv sync --frozen --group docs
      - run: uv run sphinx-build -W --keep-going -b html docs docs/_build/html

  # Single required status check for branch protection. It succeeds only if
  # every job listed in `needs` succeeded, so the ruleset does not have to be
  # updated when jobs are added, renamed or the test matrix changes.
  # When adding a job above, add it to `needs` as well.
  ci-passed:
    name: CI passed
    if: always()
    needs: [lint, tests, tests-all-extras, tests-pypy, docs]
    runs-on: ubuntu-latest
    steps:
      - name: Check results of all required jobs
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::At least one required job did not succeed."
              exit 1
            fi
          done
